name: Extract legacy database coursework

on:
  push:
    branches:
      - refactor/database-leetcode
    paths:
      - '.github/workflows/extract-legacy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/database-leetcode
      - name: Extract legacy archives
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _legacy_extracted
          mkdir -p _legacy_extracted
          for archive in *.zip; do
            [ -f "$archive" ] || continue
            dest="_legacy_extracted/${archive%.zip}"
            mkdir -p "$dest"
            unzip -oq "$archive" -d "$dest"
          done
          find _legacy_extracted -type d -name '__MACOSX' -prune -exec rm -rf {} + || true
          find _legacy_extracted -type f \( -name '.DS_Store' -o -name '._*' \) -delete || true
          {
            echo '# Legacy extraction inventory'
            echo
            echo 'Generated automatically from the original coursework archives.'
            echo
            find _legacy_extracted -type f | sort | sed 's#^#- `#; s#$#`#'
          } > LEGACY_INVENTORY.md
      - name: Commit extracted coursework
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _legacy_extracted LEGACY_INVENTORY.md
          if ! git diff --cached --quiet; then
            git commit -m 'chore: extract legacy database coursework'
            git push origin HEAD:refactor/database-leetcode
          fi
